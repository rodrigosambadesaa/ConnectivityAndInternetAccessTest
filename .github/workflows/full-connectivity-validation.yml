name: Full connectivity validation

on:
  push:
    branches:
      - master
      - ci/full-connectivity-validation-2026-10-07
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-connectivity-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-sync-and-unit:
    name: Latest Gist sync + deterministic matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Create CI-only Firebase config
        shell: bash
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "connectivity-ci-placeholder",
              "storage_bucket": "connectivity-ci-placeholder.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:123456789012:android:0123456789abcdef",
                "android_client_info": {
                  "package_name": "com.example.connectivityandinternetaccesstest"
                }
              },
              "api_key": [{"current_key": "AIzaSyCIPlaceholderNotARealCredential000000"}],
              "services": {"appinvite_service": {"other_platform_oauth_client": []}}
            }],
            "configuration_version": "1"
          }
          JSON

      - name: Download the current Gist implementation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci app/src/test/java/net/i2p/android/router/util
          curl --fail --location --retry 3 \
            'https://gist.githubusercontent.com/rodrigosambadesaa/729cca29a031fef4e2f15751863b655f/raw/ConnectivityAndInternetAccess.java' \
            --output .ci/gist-ConnectivityAndInternetAccess.java
          curl --fail --location --retry 3 \
            'https://gist.githubusercontent.com/rodrigosambadesaa/729cca29a031fef4e2f15751863b655f/raw/ConnectivityAndInternetAccess.kt' \
            --output .ci/gist-ConnectivityAndInternetAccess.kt
          cp .ci/gist-ConnectivityAndInternetAccess.java \
            app/src/test/java/net/i2p/android/router/util/ConnectivityAndInternetAccess.java

      - name: Verify repository Java copy exactly matches latest Gist
        shell: bash
        run: |
          set -euo pipefail
          sed 's/^package net\.i2p\.android\.router\.util;$/package com.example.connectivityandinternetaccesstest;/' \
            .ci/gist-ConnectivityAndInternetAccess.java > .ci/gist-normalized.java
          if ! cmp -s \
            app/src/main/java/com/example/connectivityandinternetaccesstest/ConnectivityAndInternetAccess.java \
            .ci/gist-normalized.java; then
            echo "::error::Repository Java source is not synchronized with the latest Gist."
            diff -u \
              app/src/main/java/com/example/connectivityandinternetaccesstest/ConnectivityAndInternetAccess.java \
              .ci/gist-normalized.java || true
            exit 1
          fi
          echo "Repository Java source matches the latest Gist byte-for-byte after package normalization."

      - name: Prepare local TLS and privileged-port fixtures
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair \
            -alias localhost \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2 \
            -dname 'CN=localhost' \
            -ext 'SAN=dns:localhost,ip:127.0.0.1' \
            -storetype PKCS12 \
            -keystore "$GITHUB_WORKSPACE/.ci/test-tls.p12" \
            -storepass changeit \
            -keypass changeit \
            -noprompt
          keytool -exportcert -alias localhost -keystore "$GITHUB_WORKSPACE/.ci/test-tls.p12" -storepass changeit -rfc -file "$GITHUB_WORKSPACE/.ci/localhost.crt"
          cp "$JAVA_HOME/lib/security/cacerts" "$GITHUB_WORKSPACE/.ci/test-truststore.jks"
          chmod u+w "$GITHUB_WORKSPACE/.ci/test-truststore.jks"
          keytool -importcert -alias connectivity-ci-localhost -file "$GITHUB_WORKSPACE/.ci/localhost.crt" -keystore "$GITHUB_WORKSPACE/.ci/test-truststore.jks" -storepass changeit -noprompt
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=0

      - name: Run complete deterministic JVM/Robolectric matrix
        shell: bash
        env:
          TEST_TLS_KEYSTORE: ${{ github.workspace }}/.ci/test-tls.p12
          JAVA_TOOL_OPTIONS: >-
            -Djavax.net.ssl.trustStore=${{ github.workspace }}/.ci/test-truststore.jks
            -Djavax.net.ssl.trustStorePassword=changeit
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Upload deterministic test reports and tested Gist sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-unit-validation
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            .ci/gist-ConnectivityAndInternetAccess.java
            .ci/gist-ConnectivityAndInternetAccess.kt
          if-no-files-found: warn

  kotlin-gist-build:
    name: Compile latest Kotlin Gist in Android project
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Create CI-only Firebase config
        shell: bash
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "connectivity-ci-placeholder",
              "storage_bucket": "connectivity-ci-placeholder.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:123456789012:android:0123456789abcdef",
                "android_client_info": {
                  "package_name": "com.example.connectivityandinternetaccesstest"
                }
              },
              "api_key": [{"current_key": "AIzaSyCIPlaceholderNotARealCredential000000"}],
              "services": {"appinvite_service": {"other_platform_oauth_client": []}}
            }],
            "configuration_version": "1"
          }
          JSON

      - name: Add latest Kotlin Gist source to build
        shell: bash
        run: |
          set -euo pipefail
          target='app/src/main/java/net/i2p/android/router/util/ConnectivityAndInternetAccess.kt'
          mkdir -p "$(dirname "$target")"
          curl --fail --location --retry 3 \
            'https://gist.githubusercontent.com/rodrigosambadesaa/729cca29a031fef4e2f15751863b655f/raw/ConnectivityAndInternetAccess.kt' \
            --output "$target"

      - name: Compile Java app plus latest Kotlin Gist
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

  android-runtime-network-matrix:
    name: Android emulator degraded-network matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Create CI-only Firebase config
        shell: bash
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "connectivity-ci-placeholder",
              "storage_bucket": "connectivity-ci-placeholder.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:123456789012:android:0123456789abcdef",
                "android_client_info": {
                  "package_name": "com.example.connectivityandinternetaccesstest"
                }
              },
              "api_key": [{"current_key": "AIzaSyCIPlaceholderNotARealCredential000000"}],
              "services": {"appinvite_service": {"other_platform_oauth_client": []}}
            }],
            "configuration_version": "1"
          }
          JSON

      - name: Run API 35 real-network matrix
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -eu
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

            run_profile() {
              profile="$1"
              speed="$2"
              delay="$3"
              echo "===== NETWORK PROFILE: $profile speed=$speed delay=$delay ====="
              adb emu network speed "$speed"
              adb emu network delay "$delay"
              sleep 3
              adb logcat -c
              output="$(adb shell am instrument -w -r \
                -e class com.example.connectivityandinternetaccesstest.ConnectivityRuntimeInstrumentedTest \
                com.example.connectivityandinternetaccesstest.test/androidx.test.runner.AndroidJUnitRunner)"
              printf '%s\n' "$output"
              adb logcat -d -s ConnectivityCI:I '*:S' || true
              if printf '%s\n' "$output" | grep -qE 'FAILURES|INSTRUMENTATION_FAILED|Process crashed'; then
                echo "::error::Instrumentation failed under network profile $profile"
                return 1
              fi
              printf '%s\n' "$output" | grep -q 'OK ('
            }

            run_profile full full none
            run_profile gprs gprs gprs
            run_profile edge edge edge
            run_profile umts umts umts
            run_profile high-latency-jitter 256:512 400:1200

            adb emu network speed full
            adb emu network delay none
            adb shell settings put global private_dns_mode opportunistic
            sleep 3
            run_profile private-dns-opportunistic full none
            adb shell settings delete global private_dns_mode || true

      - name: Upload Android test outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-runtime-network-matrix
          path: |
            app/build/outputs/apk/
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
          if-no-files-found: warn
