name: Captive portal matrix

# Tests the current connectivity gist against reproducible local captive-portal simulations.
on:
  push:
    branches:
      - master
      - ci/captive-portal-matrix
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-captive-portal:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Download current Java implementation from gist
        shell: bash
        run: |
          set -euo pipefail
          target='app/src/test/java/net/i2p/android/router/util/ConnectivityAndInternetAccess.java'
          mkdir -p "$(dirname "$target")"
          curl --fail --location --retry 3 \
            'https://gist.githubusercontent.com/rodrigosambadesaa/729cca29a031fef4e2f15751863b655f/raw/ConnectivityAndInternetAccess.java' \
            --output "$target"
          grep -q 'class StrictHttpProbe' "$target"
          grep -q 'generate_204' "$target"

      - name: Create CI-only Firebase config
        shell: bash
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "connectivity-ci-placeholder",
              "storage_bucket": "connectivity-ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:0123456789abcdef",
                  "android_client_info": {
                    "package_name": "com.example.connectivityandinternetaccesstest"
                  }
                },
                "api_key": [
                  {
                    "current_key": "AIzaSyCIPlaceholderNotARealCredential000000"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Run strict captive-portal simulation matrix
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest --tests 'net.i2p.android.router.util.StrictCaptivePortalProbeTest'

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captive-portal-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
